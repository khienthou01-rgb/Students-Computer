<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <!-- Graduation Academic Gown with Royal Blue/Gold Hood -->
  <defs>
    <linearGradient id="gownGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="hoodGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Gown Robe Body -->
  <path d="M 30 350 L 120 85 L 200 65 L 250 110 L 300 65 L 380 85 L 470 350 Z" fill="url(#gownGrad)" stroke="#374151" stroke-width="2"/>

  <!-- Ceremonial Satin Academic Hood (Blue with Gold trim) -->
  <path d="M 180 75 Q 250 170 320 75 L 300 65 Q 250 150 200 65 Z" fill="url(#hoodGrad)" stroke="#f59e0b" stroke-width="3"/>

  <!-- Inner Gold Ribbon Border -->
  <path d="M 190 73 Q 250 158 310 73" stroke="#fbbf24" stroke-width="2.5" fill="none"/>

  <!-- Center Zipper/Pleat Placket -->
  <rect x="245" y="110" width="10" height="240" fill="#1f2937" stroke="#111827" stroke-width="1"/>

  <!-- Pleat Vertical Shadows -->
  <path d="M 140 120 L 150 350" stroke="#000000" stroke-width="3" opacity="0.4"/>
  <path d="M 210 140 L 215 350" stroke="#000000" stroke-width="3" opacity="0.4"/>
  <path d="M 290 140 L 285 350" stroke="#000000" stroke-width="3" opacity="0.4"/>
  <path d="M 360 120 L 350 350" stroke="#000000" stroke-width="3" opacity="0.4"/>
</svg>
