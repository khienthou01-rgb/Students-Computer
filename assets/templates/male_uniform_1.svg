<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <!-- Male Student White Uniform Shirt -->
  <defs>
    <linearGradient id="shirtGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Left & Right Shoulders -->
  <path d="M 50 350 L 130 90 L 210 70 L 250 115 L 290 70 L 370 90 L 450 350 Z" fill="url(#shirtGrad)" stroke="#cbd5e1" stroke-width="2" filter="url(#softShadow)"/>

  <!-- Center Placket -->
  <rect x="238" y="115" width="24" height="235" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Buttons -->
  <circle cx="250" cy="150" r="4.5" fill="#64748b" stroke="#475569" stroke-width="1"/>
  <circle cx="250" cy="200" r="4.5" fill="#64748b" stroke="#475569" stroke-width="1"/>
  <circle cx="250" cy="250" r="4.5" fill="#64748b" stroke="#475569" stroke-width="1"/>
  <circle cx="250" cy="300" r="4.5" fill="#64748b" stroke="#475569" stroke-width="1"/>

  <!-- Left Pocket -->
  <path d="M 120 180 L 175 180 L 175 235 L 147 250 L 120 235 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="120" y1="195" x2="175" y2="195" stroke="#e2e8f0" stroke-width="1"/>

  <!-- School Pocket Pen slot -->
  <rect x="135" y="170" width="8" height="20" rx="3" fill="#1e3a8a"/>

  <!-- Left Collar Leaf -->
  <path d="M 210 70 L 250 115 L 180 135 L 195 80 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <!-- Right Collar Leaf -->
  <path d="M 290 70 L 250 115 L 320 135 L 305 80 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>

  <!-- Subtle Shoulder Seams -->
  <path d="M 130 90 L 210 70" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3,3"/>
  <path d="M 370 90 L 290 70" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3,3"/>
</svg>
