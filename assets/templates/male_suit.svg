<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <!-- Formal Black/Navy Suit with Shirt & Tie -->
  <defs>
    <linearGradient id="suitGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="tieGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>

  <!-- Suit Outer Shoulders -->
  <path d="M 40 350 L 125 85 L 210 65 L 250 115 L 290 65 L 375 85 L 460 350 Z" fill="url(#suitGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Inner White Shirt V-Area -->
  <polygon points="210,65 290,65 250,220" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Shirt Collars -->
  <polygon points="210,65 250,115 220,125" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="290,65 250,115 280,125" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Formal Red Necktie Knot & Body -->
  <polygon points="242,105 258,105 255,122 245,122" fill="#b91c1c"/>
  <polygon points="245,122 255,122 260,250 250,270 240,250" fill="url(#tieGrad)" stroke="#7f1d1d" stroke-width="1"/>

  <!-- Left Lapel -->
  <path d="M 210 65 L 250 220 L 180 180 L 195 90 Z" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <!-- Right Lapel -->
  <path d="M 290 65 L 250 220 L 320 180 L 305 90 Z" fill="#1e293b" stroke="#475569" stroke-width="2"/>

  <!-- Left Suit Pocket Square -->
  <rect x="110" y="190" width="55" height="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <polygon points="120,190 135,178 150,190" fill="#ffffff"/>
</svg>
