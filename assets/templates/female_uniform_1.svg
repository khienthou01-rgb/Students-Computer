<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <!-- Female Student White Uniform Blouse -->
  <defs>
    <linearGradient id="blouseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="softShadowF" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Shoulders & Blouse Body -->
  <path d="M 60 350 L 140 95 L 210 75 L 250 120 L 290 75 L 360 95 L 440 350 Z" fill="url(#blouseGrad)" stroke="#cbd5e1" stroke-width="2" filter="url(#softShadowF)"/>

  <!-- Center Placket -->
  <rect x="240" y="120" width="20" height="230" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>

  <!-- Elegant Pearl Buttons -->
  <circle cx="250" cy="155" r="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="250" cy="205" r="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="250" cy="255" r="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="250" cy="305" r="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>

  <!-- Peter Pan / Rounded Collar Left -->
  <path d="M 210 75 C 230 110, 245 125, 250 125 C 220 145, 180 130, 185 85 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <!-- Rounded Collar Right -->
  <path d="M 290 75 C 270 110, 255 125, 250 125 C 280 145, 320 130, 315 85 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>

  <!-- Modest Blue Bow Tie Ribbon -->
  <path d="M 250 125 L 235 138 L 243 145 L 250 132 L 257 145 L 265 138 Z" fill="#1e40af"/>
  <circle cx="250" cy="128" r="4" fill="#2563eb"/>

  <!-- Left/Right Dart Lines -->
  <path d="M 175 160 Q 185 240 180 340" stroke="#e2e8f0" stroke-width="1.5" fill="none"/>
  <path d="M 325 160 Q 315 240 320 340" stroke="#e2e8f0" stroke-width="1.5" fill="none"/>
</svg>
