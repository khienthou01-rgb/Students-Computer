  <!-- PWA Service Worker Registration & Live Auto-Update Orchestrator -->
  <script>
    if ("serviceWorker" in navigator) {
      let refreshing = false;

      // When controller changes (new service worker took over), reload cleanly
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });

      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .then((reg) => {
            console.log("🚀 TIS Lab Computer PWA Service Worker Registered:", reg.scope);

            function showUpdatePrompt(worker) {
              const banner = document.getElementById("msUpdateBanner");
              const btn = document.getElementById("btnReloadUpdate");
              if (banner) {
                banner.classList.add("show");
              }
              if (btn) {
                btn.onclick = () => {
                  btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> កំពុង Update...`;
                  btn.style.pointerEvents = "none";
                  if (worker) {
                    worker.postMessage({ type: "SKIP_WAITING" });
                  } else {
                    window.location.reload();
                  }
                };
              }
            }

            // If a worker is already waiting, prompt immediately
            if (reg.waiting) {
              showUpdatePrompt(reg.waiting);
            }

            // Listen for new worker updates
            reg.addEventListener("updatefound", () => {
              const newWorker = reg.installing;
              if (newWorker) {
                newWorker.addEventListener("statechange", () => {
                  if (newWorker.state === "installed" && navigator.serviceWorker.controller) {
                    showUpdatePrompt(newWorker);
                  }
                });
              }
            });

            // Recheck on tab focus / visibility change
            document.addEventListener("visibilitychange", () => {
              if (document.visibilityState === "visible") {
                reg.update().catch(() => {});
              }
            });
            window.addEventListener("focus", () => {
              reg.update().catch(() => {});
            });

            // Recheck every 2 minutes
            setInterval(() => {
              reg.update().catch(() => {});
            }, 120000);
          })
          .catch((err) => console.log("⚠️ PWA Service Worker Registration Failed:", err));
      });
    }
  </script>
